<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Create Order</title>
  <link href="https://stackpath.bootstrapcdn.com/bootstrap/4.1.3/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-MCw98/SFnGE8fJT3GXwEOngsV7Zt27NXFoaoApmYm81iuXoPkFOJwJ8ERdknLPMO" crossorigin="anonymous">
  <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark app-navbar">
  <div class="container">
    <a class="navbar-brand" th:href="@{/}">ADV Shop</a>
    <div class="navbar-nav ml-auto">
      <a class="nav-link" th:href="@{/}">Home</a>
      <a class="nav-link" th:href="@{/order/create}">Create Order</a>
      <a class="nav-link" th:href="@{/order/history}">Order History</a>
    </div>
  </div>
</nav>

<main class="container app-container">
  <div class="page-header mb-4">
    <h2 class="page-title">Create Order</h2>
    <p class="page-subtitle">Buat order baru dengan satu item produk.</p>
  </div>

  <div class="card p-4">
    <form th:action="@{/order/create}" method="post">
      <div class="form-group">
        <label for="authorInput">Author</label>
        <input id="authorInput" name="author" type="text" class="form-control mb-2" placeholder="Masukkan nama author" required>
      </div>
      <div class="form-group">
        <label for="productNameInput">Product Name</label>
        <input id="productNameInput" name="productName" type="text" class="form-control mb-2" placeholder="Masukkan nama produk" required>
      </div>
      <div class="form-group">
        <label for="productQuantityInput">Product Quantity</label>
        <input id="productQuantityInput" name="productQuantity" type="number" min="1" class="form-control mb-2" placeholder="Masukkan jumlah produk" required>
      </div>
      <div class="d-flex align-items-center flex-wrap">
        <button type="submit" class="btn btn-primary">Create Order</button>
        <a th:href="@{/order/history}" class="btn btn-link ml-2">Go to history</a>
      </div>
    </form>
  </div>
</main>

<footer class="site-footer">
  <div class="container d-flex justify-content-between align-items-center flex-wrap">
    <span>ADV Shop - order management.</span>
    <a th:href="@{/order/history}">View order history</a>
  </div>
</footer>
</body>
</html>
