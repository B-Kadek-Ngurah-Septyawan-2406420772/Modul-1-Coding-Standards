<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Payment Admin List</title>
  <link href="https://stackpath.bootstrapcdn.com/bootstrap/4.1.3/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-MCw98/SFnGE8fJT3GXwEOngsV7Zt27NXFoaoApmYm81iuXoPkFOJwJ8ERdknLPMO" crossorigin="anonymous">
  <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>
<main class="container app-container">
  <div class="page-header mb-4">
    <h2 class="page-title">Payment Admin List</h2>
    <p class="page-subtitle">Kelola seluruh transaksi payment.</p>
  </div>

  <div th:if="${#lists.isEmpty(payments)}" class="empty-state mb-3">
    No payments available.
  </div>

  <table id="paymentTable" th:if="${!#lists.isEmpty(payments)}" class="table table-striped table-hover table-responsive-md">
    <thead class="thead-light">
    <tr>
      <th scope="col">Payment ID</th>
      <th scope="col">Method</th>
      <th scope="col">Status</th>
      <th scope="col">Action</th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="payment : ${payments}">
      <td th:text="${payment.id}"></td>
      <td th:text="${payment.method}"></td>
      <td th:text="${payment.status}"></td>
      <td>
        <a class="btn btn-primary btn-sm adminDetailButton"
           th:href="@{/payment/admin/detail/{paymentId}(paymentId=${payment.id})}">
          Detail
        </a>
      </td>
    </tr>
    </tbody>
  </table>
</main>
</body>
</html>
