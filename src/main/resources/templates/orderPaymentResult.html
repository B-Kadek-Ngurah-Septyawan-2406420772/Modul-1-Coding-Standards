<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Order Payment Result</title>
  <link href="https://stackpath.bootstrapcdn.com/bootstrap/4.1.3/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-MCw98/SFnGE8fJT3GXwEOngsV7Zt27NXFoaoApmYm81iuXoPkFOJwJ8ERdknLPMO" crossorigin="anonymous">
  <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark app-navbar">
  <div class="container">
    <a class="navbar-brand" th:href="@{/}">ADV Shop</a>
    <div class="navbar-nav ml-auto">
      <a class="nav-link" th:href="@{/order/history}">Order History</a>
      <a class="nav-link" th:href="@{/payment/admin/list}">Payment Admin</a>
    </div>
  </div>
</nav>

<main class="container app-container">
  <div class="card p-4">
    <h2 class="page-title mb-3">Payment Created</h2>
    <div class="mb-2"><strong>Payment ID:</strong> <span id="paymentIdValue" th:text="${payment.id}"></span></div>
    <div class="mb-2"><strong>Method:</strong> <span id="paymentMethodValue" th:text="${payment.method}"></span></div>
    <div class="mb-3"><strong>Status:</strong> <span id="paymentStatusValue" th:text="${payment.status}"></span></div>
    <a id="paymentDetailLink" class="btn btn-primary btn-sm"
       th:href="@{/payment/detail/{paymentId}(paymentId=${payment.id})}">
      View Payment Detail
    </a>
  </div>
</main>
</body>
</html>
