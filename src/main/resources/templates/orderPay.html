<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Pay Order</title>
  <link href="https://stackpath.bootstrapcdn.com/bootstrap/4.1.3/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-MCw98/SFnGE8fJT3GXwEOngsV7Zt27NXFoaoApmYm81iuXoPkFOJwJ8ERdknLPMO" crossorigin="anonymous">
  <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark app-navbar">
  <div class="container">
    <a class="navbar-brand" th:href="@{/}">ADV Shop</a>
    <div class="navbar-nav ml-auto">
      <a class="nav-link" th:href="@{/order/create}">Create Order</a>
      <a class="nav-link" th:href="@{/order/history}">Order History</a>
      <a class="nav-link" th:href="@{/payment/admin/list}">Payment Admin</a>
    </div>
  </div>
</nav>

<main class="container app-container">
  <div class="page-header mb-4">
    <h2 class="page-title">Pay Order</h2>
    <p class="page-subtitle">Lengkapi data pembayaran untuk order ini.</p>
  </div>

  <div class="card p-4 mb-4">
    <div class="mb-2"><strong>Order ID:</strong> <span id="orderIdValue" th:text="${order.id}"></span></div>
    <div class="mb-2"><strong>Author:</strong> <span th:text="${order.author}"></span></div>
    <div class="mb-2"><strong>Current Status:</strong> <span th:text="${order.status}"></span></div>
  </div>

  <div class="card p-4">
    <form th:action="@{/order/pay/{orderId}(orderId=${order.id})}" method="post">
      <div class="form-group">
        <label for="methodSelect">Payment Method</label>
        <select id="methodSelect" name="method" class="form-control mb-2">
          <option value="VOUCHER_CODE">VOUCHER_CODE</option>
          <option value="BANK_TRANSFER">BANK_TRANSFER</option>
        </select>
      </div>

      <div class="form-group">
        <label for="voucherCodeInput">Voucher Code</label>
        <input id="voucherCodeInput" name="voucherCode" type="text" class="form-control mb-2" placeholder="ESHOP1234ABC5678">
      </div>

      <div class="form-group">
        <label for="bankNameInput">Bank Name</label>
        <input id="bankNameInput" name="bankName" type="text" class="form-control mb-2" placeholder="BCA">
      </div>

      <div class="form-group">
        <label for="referenceCodeInput">Reference Code</label>
        <input id="referenceCodeInput" name="referenceCode" type="text" class="form-control mb-2" placeholder="INV-001">
      </div>

      <button id="payOrderButton" type="submit" class="btn btn-primary">Pay Order</button>
    </form>
  </div>
</main>
</body>
</html>
