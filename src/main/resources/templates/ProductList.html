<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Product List</title>
  <link href="https://stackpath.bootstrapcdn.com/bootstrap/4.1.3/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-MCw98/SFnGE8fJT3GXwEOngsV7Zt27NXFoaoApmYm81iuXoPkFOJwJ8ERdknLPMO" crossorigin="anonymous">
  <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark app-navbar">
  <div class="container">
    <a class="navbar-brand" th:href="@{/}">ADV Shop</a>
    <div class="navbar-nav ml-auto">
      <a class="nav-link" th:href="@{/}">Home</a>
      <a class="nav-link" th:href="@{/product/list}">Products</a>
      <a class="nav-link" th:href="@{/product/create}">Create</a>
    </div>
  </div>
</nav>

<main class="container app-container">
  <div class="d-flex justify-content-between align-items-center flex-wrap mb-3">
    <div>
      <h2 class="page-title">Product List</h2>
      <p class="page-subtitle">Manage your inventory in one place.</p>
    </div>
    <div class="d-flex align-items-center flex-wrap">
      <span class="badge badge-pill badge-count mr-3" th:text="${#lists.size(products)}"></span>
      <a th:href="@{/product/create}" class="btn btn-primary btn-sm">Create Product</a>
    </div>
  </div>

  <div th:if="${#lists.isEmpty(products)}" class="empty-state mb-3">
    No products yet. Create your first product to get started.
  </div>

  <table class="table table-striped table-hover table-responsive-md">
    <thead class="thead-light">
    <tr>
      <th scope="col">Product Name</th>
      <th scope="col">Quantity</th>
      <th scope="col">Action</th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="product: ${products}">
      <td th:text="${product.productName}"></td>
      <td th:text="${product.productQuantity}"></td>
      <td class="action-buttons">
        <a th:href="@{/product/edit/{productId}(productId=${product.productId})}" class="btn btn-primary btn-sm">Edit</a>
        <button type="button" class="btn btn-danger btn-sm"
                data-bs-toggle="modal"
                data-bs-target="#deleteModal"
                th:data-product-id="${product.productId}"
                th:data-product-name="${product.productName}">
          Delete
        </button>
      </td>
    </tr>
    </tbody>
  </table>
</main>

<footer class="site-footer">
  <div class="container d-flex justify-content-between align-items-center flex-wrap">
    <span>ADV Shop - simple product management.</span>
    <a th:href="@{/product/create}">Create another product</a>
  </div>
</footer>

<div class="modal fade" id="deleteModal" tabindex="-1" aria-labelledby="deleteModalLabel" aria-hidden="true">
  <div class="modal-dialog">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title" id="deleteModalLabel">Delete Product</h5>
        <button type="button" class="close" data-bs-dismiss="modal" aria-label="Close">
          <span aria-hidden="true">&times;</span>
        </button>
      </div>
      <div class="modal-body">
        Are you sure you want to delete <strong id="deleteProductName"></strong>?
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary btn-sm" data-bs-dismiss="modal">Cancel</button>
        <form id="deleteForm" method="post" class="d-inline">
          <button type="submit" class="btn btn-danger btn-sm">Delete</button>
        </form>
      </div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-ka7Sk0Gln4gmtz2MlQnikT1wXgYsOg+OMhuP+IlRH9sENBO0LRn5q+8nbTov4+1p" crossorigin="anonymous"></script>
<script>
  const deleteModal = document.getElementById('deleteModal');
  if (deleteModal) {
    deleteModal.addEventListener('show.bs.modal', function (event) {
      const button = event.relatedTarget;
      const productId = button.getAttribute('data-product-id');
      const productName = button.getAttribute('data-product-name');
      const deleteForm = deleteModal.querySelector('#deleteForm');
      deleteForm.action = `/product/delete/${productId}`;
      const deleteProductName = deleteModal.querySelector('#deleteProductName');
      deleteProductName.textContent = productName || '';
    });
  }
</script>
</body>
</html>
