<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Payment Admin Detail</title>
  <link href="https://stackpath.bootstrapcdn.com/bootstrap/4.1.3/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-MCw98/SFnGE8fJT3GXwEOngsV7Zt27NXFoaoApmYm81iuXoPkFOJwJ8ERdknLPMO" crossorigin="anonymous">
  <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>
<main class="container app-container">
  <div class="card p-4" th:if="${payment != null}">
    <h2 class="page-title mb-3">Payment Admin Detail</h2>
    <div class="mb-2"><strong>Payment ID:</strong> <span th:text="${payment.id}"></span></div>
    <div class="mb-2"><strong>Method:</strong> <span th:text="${payment.method}"></span></div>
    <div class="mb-3"><strong>Current Status:</strong> <span id="adminPaymentStatus" th:text="${payment.status}"></span></div>

    <form th:action="@{/payment/admin/set-status/{paymentId}(paymentId=${payment.id})}" method="post">
      <div class="form-group">
        <label for="statusSelect">Set Status</label>
        <select id="statusSelect" name="status" class="form-control mb-2">
          <option value="SUCCESS">SUCCESS</option>
          <option value="REJECTED">REJECTED</option>
        </select>
      </div>
      <button id="setStatusButton" type="submit" class="btn btn-primary">Update Status</button>
    </form>
  </div>

  <div class="card p-4" th:if="${payment == null}">
    <h2 class="page-title mb-3">Payment Not Found</h2>
    <p class="mb-0">Payment tidak ditemukan.</p>
  </div>
</main>
</body>
</html>
