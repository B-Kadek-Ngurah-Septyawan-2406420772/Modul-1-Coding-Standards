<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Payment Detail Form</title>
  <link href="https://stackpath.bootstrapcdn.com/bootstrap/4.1.3/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-MCw98/SFnGE8fJT3GXwEOngsV7Zt27NXFoaoApmYm81iuXoPkFOJwJ8ERdknLPMO" crossorigin="anonymous">
  <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>
<main class="container app-container">
  <div class="card p-4">
    <h2 class="page-title mb-3">Payment Detail</h2>
    <form id="paymentLookupForm">
      <div class="form-group">
        <label for="paymentIdInput">Payment ID</label>
        <input id="paymentIdInput" type="text" class="form-control mb-2" placeholder="Masukkan payment ID" required>
      </div>
      <button id="findPaymentButton" type="submit" class="btn btn-primary">Find Payment</button>
    </form>
  </div>
</main>

<script>
  const form = document.getElementById('paymentLookupForm');
  form.addEventListener('submit', function (event) {
    event.preventDefault();
    const paymentId = document.getElementById('paymentIdInput').value.trim();
    if (!paymentId) {
      return;
    }
    window.location.href = '/payment/detail/' + paymentId;
  });
</script>
</body>
</html>
