<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Payment Detail</title>
  <link href="https://stackpath.bootstrapcdn.com/bootstrap/4.1.3/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-MCw98/SFnGE8fJT3GXwEOngsV7Zt27NXFoaoApmYm81iuXoPkFOJwJ8ERdknLPMO" crossorigin="anonymous">
  <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>
<main class="container app-container">
  <div class="card p-4" th:if="${payment != null}">
    <h2 class="page-title mb-3">Payment Detail</h2>
    <div class="mb-2"><strong>Payment ID:</strong> <span id="paymentDetailId" th:text="${payment.id}"></span></div>
    <div class="mb-2"><strong>Method:</strong> <span id="paymentDetailMethod" th:text="${payment.method}"></span></div>
    <div class="mb-2"><strong>Status:</strong> <span id="paymentDetailStatus" th:text="${payment.status}"></span></div>
    <div class="mb-2"><strong>Order ID:</strong> <span id="paymentDetailOrderId" th:text="${payment.order.id}"></span></div>
  </div>

  <div class="card p-4" th:if="${payment == null}">
    <h2 class="page-title mb-3">Payment Not Found</h2>
    <p class="mb-0">Payment tidak ditemukan.</p>
  </div>
</main>
</body>
</html>
