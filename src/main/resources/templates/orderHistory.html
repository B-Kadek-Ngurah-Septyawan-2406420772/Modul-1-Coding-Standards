<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Order History</title>
  <link href="https://stackpath.bootstrapcdn.com/bootstrap/4.1.3/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-MCw98/SFnGE8fJT3GXwEOngsV7Zt27NXFoaoApmYm81iuXoPkFOJwJ8ERdknLPMO" crossorigin="anonymous">
  <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark app-navbar">
  <div class="container">
    <a class="navbar-brand" th:href="@{/}">ADV Shop</a>
    <div class="navbar-nav ml-auto">
      <a class="nav-link" th:href="@{/}">Home</a>
      <a class="nav-link" th:href="@{/order/create}">Create Order</a>
      <a class="nav-link" th:href="@{/order/history}">Order History</a>
    </div>
  </div>
</nav>

<main class="container app-container">
  <div class="page-header mb-4">
    <h2 class="page-title">Order History</h2>
    <p class="page-subtitle">Cari daftar order berdasarkan nama author.</p>
  </div>

  <div class="card p-4 mb-4">
    <form id="orderHistoryForm" th:action="@{/order/history}" method="post">
      <div class="form-group mb-0">
        <label for="historyAuthorInput">Author</label>
        <input id="historyAuthorInput" name="author" type="text" class="form-control mb-2" placeholder="Masukkan nama author" required>
      </div>
      <button id="searchOrderButton" type="submit" class="btn btn-primary">Search Orders</button>
    </form>
  </div>

  <div th:if="${author}" class="mb-2">
    <h5>Result for <span id="searchedAuthor" th:text="${author}"></span></h5>
  </div>

  <div th:if="${orders != null and #lists.isEmpty(orders)}" class="empty-state mb-3">
    No orders found for this author.
  </div>

  <table id="orderTable" th:if="${orders != null and !#lists.isEmpty(orders)}" class="table table-striped table-hover table-responsive-md">
    <thead class="thead-light">
    <tr>
      <th scope="col">Order ID</th>
      <th scope="col">Author</th>
      <th scope="col">Status</th>
      <th scope="col">Action</th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="order : ${orders}">
      <td th:text="${order.id}"></td>
      <td th:text="${order.author}"></td>
      <td th:text="${order.status}"></td>
      <td>
        <a class="btn btn-primary btn-sm"
           th:href="@{/order/pay/{orderId}(orderId=${order.id})}">
          Pay
        </a>
      </td>
    </tr>
    </tbody>
  </table>
</main>

<footer class="site-footer">
  <div class="container d-flex justify-content-between align-items-center flex-wrap">
    <span>ADV Shop - order management.</span>
    <a th:href="@{/order/create}">Create order</a>
  </div>
</footer>
</body>
</html>
